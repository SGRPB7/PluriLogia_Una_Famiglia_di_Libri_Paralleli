name: Genera Indice Automatico

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.html'

# QUESTA RIGA È LA CHIAVE: dà il permesso al robot di salvare il file
permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file del repo
        uses: actions/checkout@v4  # Aggiornato alla v4 per togliere il warning

      - name: Genera index.html con Python
        run: |
          python3 -c "
          import os
          files = [f for f in os.listdir('.') if f.endswith('.html') and f != 'index.html']
          files.sort(key=lambda x: os.path.getmtime(x), reverse=True)
          
          html = '<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Archivio</title><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:20px;} ul{list-style:none;padding:0;} li{margin:15px 0;padding:15px;background:#f6f8fa;border-radius:6px;border-left:4px solid #0366d6;} a{text-decoration:none;color:#0366d6;font-weight:bold;font-size:1.1em;}</style></head><body><h1>Archivio Articoli</h1><ul>'
          for f in files:
              nome = f.replace('.html', '').replace('_', ' ')
              html += f'<li><a href=\"{f}\">{nome}</a></li>'
          html += '</ul></body></html>'
          
          with open('index.html', 'w', encoding='utf-8') as file:
              file.write(html)
          print('Indice generato con successo.')
          "

      - name: Salva le modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "🤖 Auto-aggiornamento indice"
            git push
          fi
